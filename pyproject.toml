[project]
name = "contour"
version = "0.1.0"
description = "An autonomous options agent that measures the shape of the volatility surface and lets the measurement pick the structure."
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44",
    "numpy",
    "pandas",
    "pydantic>=2",
    "python-dotenv",
    "httpx",
    "tenacity",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because flat-layout auto-discovery also finds journal/ and tests/
# and refuses to guess between them.
[tool.setuptools]
packages = ["contour"]

[project.optional-dependencies]
# pillow is a TEST dependency, not a runtime one: the agent never draws
# anything. ops/make_cover.py generates the submission cover image, and
# test_published_claims.py opens it to check the size the form wants.
# Undeclared, it passed locally and failed on every clean checkout.
dev = ["pytest", "pillow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
