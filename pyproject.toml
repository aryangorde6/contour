[project]
name = "contour"
version = "0.1.0"
description = "An autonomous options agent that measures the shape of the volatility surface and lets the measurement pick the structure."
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44",
    "numpy",
    "pandas",
    "pydantic>=2",
    "python-dotenv",
    "httpx",
    "tenacity",
    "anthropic[bedrock]>=0.75",   # [bedrock] pulls boto3 for SigV4 signing
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because flat-layout auto-discovery also finds journal/ and tests/
# and refuses to guess between them.
[tool.setuptools]
packages = ["contour"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
