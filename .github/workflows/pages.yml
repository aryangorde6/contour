name: pages

# Publishes the dashboard to GitHub Pages as a second, independently hosted
# copy of the same file. Vercel serves it on the custom domain; this one needs
# no DNS at all, so a registrar or certificate problem cannot take both down.
#
# Like ci.yml, this is given NO secrets. It only ever copies a static file.
# push-to-main and manual only -- never pull_request, so a fork cannot publish
# to the project's own Pages origin.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Newest deploy wins. Unlike the agent, there is no state to fork here, so an
# in-flight publish of a stale commit is worth cancelling.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Every published page must be self-contained
        # They are served from a project path (/contour/) on Pages and from the
        # root on Vercel. Any root-relative URL would work on exactly one of
        # them, and the one that broke would be the one a judge opened.
        # Globbed, not named: this guard was written when index.html was the
        # only page, and a guard that only covers the first page is not one.
        run: |
          if grep -rnE '(src|href)="/[^/]' dashboard/; then
            echo "::error::root-relative URL under dashboard/ -- breaks on a Pages project path"
            exit 1
          fi
          echo "ok: no root-relative URLs"

      # No `enablement: true` here: creating the Pages site is a repo-admin
      # call, and GITHUB_TOKEN cannot make it even with pages:write -- it
      # answers "Resource not accessible by integration". The site was created
      # once out of band; this step only reads its config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deploy
        uses: actions/deploy-pages@v4
