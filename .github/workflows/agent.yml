name: contour agent

# schedule + manual only. NEVER add pull_request or pull_request_target: this
# repo is public and this workflow holds live trading credentials, so a PR from
# a fork would be able to exfiltrate them.
on:
  schedule:
    # Times are UTC. EDT is UTC-4, so 13:30-20:00 UTC is the 09:30-16:00 ET
    # session. Cron here is best-effort and routinely runs late under load --
    # every cycle is idempotent and resolves its own phase from the market
    # clock rather than trusting when it fired.
    - cron: "20 13 * * 1-5"      # 09:20 ET  pre-open: parse event blackouts
    - cron: "*/15 14-19 * * 1-5" # 10:00-15:45 ET  the trading cycle
    - cron: "50 19 * * 4"        # 15:50 ET Thu  flatten escalation to market
  workflow_dispatch:
    inputs:
      dry:
        description: "measure and gate, but submit nothing"
        type: boolean
        default: true
      dev:
        description: "use the throwaway account instead of the judged one"
        type: boolean
        default: true

permissions:
  contents: write

# Single writer. Queue overlapping runs rather than cancelling, so a slow cycle
# can never race a new one and fork the journal's hash chain.
concurrency:
  group: contour-agent
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Worst case is not the common case but it is reachable: three entry
    # ladders at 3 rungs x 90s = 810s, plus up to five LLM calls, plus exits.
    # A job killed at 12 minutes skips the publish step, which now loses the
    # freshly-recorded position as well as the journal -- i.e. it recreates
    # the unmanaged-book bug. The concurrency group queues rather than
    # overlaps, so a long cycle is safe.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache the Alpaca CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/alpaca
          key: alpaca-cli-v0.0.14

      - name: Install the Alpaca CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: go install github.com/alpacahq/cli/cmd/alpaca@v0.0.14

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -e .

      - name: Restore journal and state from the agent-state branch
        run: |
          git fetch origin agent-state --depth=1 || echo "agent-state does not exist yet"
          if git rev-parse --verify origin/agent-state >/dev/null 2>&1; then
            git checkout origin/agent-state -- journal state 2>/dev/null || true
          fi
          mkdir -p journal state

      - name: Run one cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DEV_API_KEY: ${{ secrets.ALPACA_DEV_API_KEY }}
          ALPACA_DEV_SECRET_KEY: ${{ secrets.ALPACA_DEV_SECRET_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CONTOUR_LLM: ${{ vars.CONTOUR_LLM }}
        run: |
          ARGS="--once"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          [ "${{ inputs.dev }}" = "true" ] && ARGS="$ARGS --dev"
          echo "running: python -m contour $ARGS"
          python -m contour $ARGS

      # Both run even when the cycle failed: a crash after a fill still has a
      # position and a journal worth keeping, and losing them is how an
      # unmanaged position happens. Publishing is still gated on the chain
      # verifying, so a corrupt journal is never pushed.
      - name: Verify the hash chain before publishing
        id: verify
        if: always()
        run: python -m contour --verify

      - name: Publish journal and state to the agent-state branch
        if: always() && steps.verify.outcome == 'success'
        # Built with a scratch index rather than a branch switch. The old
        # version stashed journal/ and state/, checked out agent-state and
        # popped -- but `stash --include-untracked` skips *ignored* files, and
        # both directories are gitignored, so the outputs stayed in the working
        # tree and the checkout aborted on "local changes would be overwritten".
        # Here the working tree is never touched: we stage the two directories
        # into a throwaway index, write a tree, and commit it straight onto the
        # branch tip. No switch, so nothing can collide.
        run: |
          git config user.name "contour-agent"
          git config user.email "aryangorde6@gmail.com"
          git fetch origin agent-state --depth=1 2>/dev/null || true
          BASE=$(git rev-parse --verify origin/agent-state 2>/dev/null || true)

          export GIT_INDEX_FILE="$RUNNER_TEMP/publish.index"
          rm -f "$GIT_INDEX_FILE"
          git add -f journal state
          TREE=$(git write-tree)

          # A publish that wipes the audit trail is worse than one that fails.
          if [ "$TREE" = "$(git hash-object -t tree /dev/null)" ]; then
            echo "::error::refusing to publish an empty tree"
            exit 1
          fi
          if [ -n "$BASE" ] && [ "$TREE" = "$(git rev-parse "$BASE^{tree}")" ]; then
            echo "nothing changed this cycle"
            exit 0
          fi

          MSG="cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          if [ -n "$BASE" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$BASE" -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi
          git push origin "$COMMIT:refs/heads/agent-state"
          echo "published $COMMIT"
